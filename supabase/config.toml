project_id = "slashtasks"

[auth]
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
enable_confirmations = true
otp_length = 6
otp_expiry = 600

[auth.email.template.magic_link]
subject = "Your SlashTasks sign-in code"
content_path = "./templates/sign-in.html"

[functions.suggest-subtasks]
verify_jwt = false

[auth.email.template.confirmation]
subject = "Your SlashTasks sign-in code"
content_path = "./templates/sign-in.html"
